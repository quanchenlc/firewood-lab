<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2b2118" />
    <title>Firewood Lab</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene" aria-label="Firewood Lab preview"></canvas>
      <div class="hud">
        <header class="brand">
          <h1>Firewood Lab</h1>
          <p>劈柴力道演示 · resolveChop</p>
        </header>
        <label class="row">
          <span>树种</span>
          <select id="species"></select>
        </label>
        <label class="row">
          <span>斧头</span>
          <select id="axe"></select>
        </label>
        <label class="row">
          <span>力道</span>
          <input id="slider" type="range" min="0" max="100" value="50" />
          <output id="slider-value">0.50</output>
        </label>
        <p class="result" id="result">—</p>
        <p class="tip" id="tip"></p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
