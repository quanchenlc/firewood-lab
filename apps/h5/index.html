<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2b2118" />
    <title>Firewood Lab</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene" aria-label="Firewood Lab"></canvas>
      <div id="flash" class="flash" aria-hidden="true"></div>

      <div id="loader" class="loader">
        <div class="loader-card">
          <h1>Firewood Lab</h1>
          <p id="loader-label">准备木柴与斧头…</p>
          <div class="loader-bar"><div id="loader-fill" class="loader-fill"></div></div>
          <p class="loader-credit">Bark & models · Poly Haven CC0</p>
        </div>
      </div>

      <!-- Tiny rest hint — fades once chopping starts (screen.toys-style lean HUD) -->
      <p id="phase-hint" class="phase-hint is-soft">拖动旋转 · 点木头劈开</p>

      <!-- Edge chips: collapsed until tapped -->
      <div id="species-chip" class="edge-chip edge-chip--left" data-open="false">
        <button type="button" id="species-chip-btn" class="edge-chip-btn" aria-expanded="false" aria-controls="species-panel">
          <span class="edge-chip-icon" aria-hidden="true">木</span>
          <span id="species-chip-label" class="edge-chip-label">树种</span>
        </button>
        <div id="species-panel" class="edge-chip-panel" hidden>
          <select id="species" aria-label="树种"></select>
        </div>
      </div>

      <div id="axe-chip" class="edge-chip edge-chip--right" data-open="false">
        <button type="button" id="axe-chip-btn" class="edge-chip-btn" aria-expanded="false" aria-controls="axe-panel">
          <span class="edge-chip-icon" aria-hidden="true">斧</span>
          <span id="axe-chip-label" class="edge-chip-label">斧头</span>
        </button>
        <div id="axe-panel" class="edge-chip-panel" hidden>
          <select id="axe" aria-label="斧头"></select>
        </div>
      </div>

      <div id="power-panel" class="power-dock is-hidden" aria-hidden="true">
        <div
          id="rhythm-bar"
          class="rhythm-bar"
          role="img"
          aria-label="力道节奏条：指针自动往返，再点一下劈下"
        >
          <div class="rhythm-track" aria-hidden="true"></div>
          <div id="sweet-zone" class="sweet-zone" aria-hidden="true"></div>
          <div id="rhythm-knob" class="rhythm-knob" aria-hidden="true"></div>
        </div>
        <p id="force-preview" class="force-preview is-idle sr-only">再点一下劈下</p>
      </div>

      <p class="result is-soft" id="result" aria-live="polite"></p>
      <button type="button" id="mute-btn" class="mute-fab" aria-label="静音" aria-pressed="false" data-muted="false">音</button>
      <button type="button" id="again-btn" class="again-fab is-hidden" aria-label="再来一斧">↺</button>

      <p class="credits" aria-hidden="true">Firewood Lab · Poly Haven CC0 · Audio CC0</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
